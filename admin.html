<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الطابور الطبي المتقدم</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .admin-container {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
        }
        h2 {
            color: #38bdf8;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #9ca3af;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            background-color: #1f2937;
            border: 1px solid #374151;
            color: white;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #38bdf8;
        }
        .btn-action {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-update-clinic { background-color: #0ea5e9; color: white; }
        .btn-next { background-color: #10b981; color: white; }
        .btn-vip { background-color: #f59e0b; color: white; }
        .btn-reset { background-color: #ef4444; color: white; }
        
        .current-display-box {
            background-color: #1f2937;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #374151;
        }
        .current-num {
            font-size: 40px;
            color: #4ade80;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>إدارة الطابور الطبي المتقدم</h2>

        <div class="form-group">
            <label>اسم العيادة / الطبيب:</label>
            <input type="text" id="clinicNameInput" value="عيادة التخصصات الطبية">
            <button class="btn-action btn-update-clinic" onclick="updateClinicName()">تحديث اسم العيادة 🏥</button>
        </div>

        <div class="form-group">
            <label>اسم المريض القادم:</label>
            <input type="text" id="patientNameInput" placeholder="أدخل اسم المريض الثلاثي...">
        </div>

        <div class="current-display-box">
            <label>رقم الدور الحالي:</label>
            <div class="current-num" id="displayNum">5</div>
        </div>

        <button class="btn-action btn-next" onclick="nextPatient()">العميل التالي ➡️</button>
        <button class="btn-action btn-vip" onclick="vipPatient()">⭐ حالة طارئة / VIP</button>
        <button class="btn-action btn-reset" onclick="resetQueue()">تصفير الطابور بالكامل 🔄</button>
    </div>

    <script>
        const socket = io();
        let currentQueueNumber = 5;
        let clinicTitle = "عيادة التخصصات الطبية";
        let waitingQueueList = [
            "الدور رقم (2) - مريض رقم 2",
            "الدور رقم (3) - حمزه",
            "الدور رقم (5) - kk"
        ];

        function updateClinicName() {
            clinicTitle = document.getElementById('clinicNameInput').value;
            syncData();
            alert('تم تحديث اسم العيادة بنجاح!');
        }

        function nextPatient() {
            const patientName = document.getElementById('patientNameInput').value.trim();
            if (!patientName) {
                alert('الرجاء إدخال اسم المريض!');
                return;
            }
            currentQueueNumber++;
            document.getElementById('displayNum').innerText = currentQueueNumber;

            // إضافة للقائمة
            waitingQueueList.push(`الدور رقم (${currentQueueNumber}) - ${patientName}`);

            syncData();
            document.getElementById('patientNameInput').value = '';
        }

        function vipPatient() {
            const patientName = document.getElementById('patientNameInput').value.trim() + " (VIP)";
            if (!patientName) {
                alert('الرجاء إدخال اسم المريض الطارئ!');
                return;
            }
            currentQueueNumber++;
            document.getElementById('displayNum').innerText = currentQueueNumber;
            waitingQueueList.unshift(`⭐ دور طارئ (${currentQueueNumber}) - ${patientName}`);

            syncData();
            document.getElementById('patientNameInput').value = '';
        }

        function resetQueue() {
            if (confirm('هل أنت متأكد من تصفير الطابور بالكامل؟')) {
                currentQueueNumber = 0;
                waitingQueueList = [];
                document.getElementById('displayNum').innerText = currentQueueNumber;
                syncData();
                alert('تم تصفير الطابور بنجاح.');
            }
        }

        function syncData() {
            const activePatient = waitingQueueList.length > 0 ? waitingQueueList[waitingQueueList.length - 1] : "---";
            const data = {
                number: currentQueueNumber,
                patientName: activePatient,
                clinicName: clinicTitle,
                waitingList: waitingQueueList
            };
            socket.emit('update-queue', data);
        }
    </script>
</body>
</html>
