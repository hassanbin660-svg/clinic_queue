<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الطبيبة</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; text-align: center; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); display: inline-block; width: 400px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h2>لوحة تحكم العيادة</h2>
        <input type="text" id="patientName" placeholder="أدخل اسم المريض">
        <input type="number" id="queueNumber" placeholder="رقم الدور">
        <button onclick="updateQueue()">تحديث وإعلان الدور</button>
    </div>

    <script>
        const socket = io();

        function updateQueue() {
            const name = document.getElementById('patientName').value;
            const number = document.getElementById('queueNumber').value;

            if (!name || !number) {
                alert('الرجاء إدخال الاسم ورقم الدور');
                return;
            }

            const data = {
                number: number,
                patientName: name,
                waitingList: []
            };

            // إرسال البيانات للسيرفر
            socket.emit('update-queue', data);
            alert('تم التحديث وإرسال الاسم للشاشة بنجاح!');
        }
    </script>
</body>
</html>
