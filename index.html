و<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة العيادة</title>
    <!-- مكتبة Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .admin-container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
            border: 1px solid #e2e8f0;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary-color);
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .btn-update {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }
        .btn-update:hover {
            background-color: var(--secondary-color);
        }
        .btn-update:active {
            transform: scale(0.98);
        }
        .status-msg {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #16a34a;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>لوحة تحكم العيادة</h2>
        
        <div class="form-group">
            <label for="patientName">اسم المريض:</label>
            <input type="text" id="patientName" placeholder="أدخل اسم المريض هنا...">
        </div>

        <div class="form-group">
            <label for="queueNumber">رقم الدور:</label>
            <input type="number" id="queueNumber" placeholder="أدخل رقم الدور...">
        </div>

        <button class="btn-update" onclick="sendUpdate()">تحديث وإعلان الدور</button>
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <script>
        const socket = io();

        function sendUpdate() {
            const name = document.getElementById('patientName').value.trim();
            const number = document.getElementById('queueNumber').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            if (!name || !number) {
                alert('الرجاء إدخال اسم المريض ورقم الدور بشكل صحيح!');
                return;
            }

            const queueData = {
                number: number,
                patientName: name,
                waitingList: []
            };

            // إرسال البيانات للسيرفر لتحديث الشاشات فوراً
            socket.emit('update-queue', queueData);

            statusMsg.innerText = 'تم إرسال التحديث بنجاح إلى شاشة الانتظار!';
            setTimeout(() => {
                statusMsg.innerText = '';
            }, 3000);
        }
    </script>
</body>
</html>
